<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parley Chat — bundle demo</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #F3EEE6; color: #1d1d1d; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 20px; }
    button { margin: 4px 6px 4px 0; padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
    code { background: #fff; padding: 2px 6px; border-radius: 4px; }
  </style>
  <script>
    window.ParleySettings = {
      publicKey: 'pk_test_demo',
      brandColor: '#1F5C45',
      businessName: 'Harbor & Pine',
      launcherLabel: null,
      page: { type: 'home', title: document.title, path: location.pathname }
    };
  </script>
</head>
<body>
  <main>
    <h1>Parley Chat — built bundle (dist/parley-live-chat.js)</h1>
    <p>Running in <code id="mode">…</code> mode. Set <code>VITE_API_BASE_URL</code> in <code>.env</code> to use a backend.</p>
    <h3>Widget API</h3>
    <button onclick="Parley('show')">Open</button>
    <button onclick="Parley('hide')">Close</button>
    <button onclick="Parley('showNewMessage', 'Hi, I have a question about my order')">New message (prefilled)</button>
    <button onclick="Parley('showTicketForm', { category: 'Order issue', orderId: 'HP-10482' })">New ticket</button>
    <button onclick="Parley('proactive', { text: 'Need help picking a tent? I can help.', delayMs: 0 })">Proactive message</button>
    <button onclick="Parley('identify', { name: 'Sofia Rossi', email: 'sofia@example.com' })">Identify visitor</button>
    <button onclick="Parley('reset')">Reset session</button>
    <h3>Simulate agent (local mode)</h3>
    <button onclick="ParleyChat.simulate('typing', { agent: 'Imran Hossain' })">Agent typing</button>
    <button onclick="ParleyChat.simulate('message.created', { message: { from: 'agent', agent: 'Imran Hossain', body: 'Hi! Imran here — how can I help?' } })">Agent message</button>
    <button onclick="ParleyChat.simulate('conversation.updated', { assignee: 'Imran Hossain' })">Assign</button>
    <button onclick="ParleyChat.simulate('conversation.updated', { status: 'resolved' })">Resolve</button>
    <button onclick="ParleyChat.simulate('conversation.updated', { status: 'open' })">Reopen</button>
    <button onclick="ParleyChat.simulate('ticket.updated', { id: 'latest', status: 'In progress', assignee: 'Imran Hossain' })">Ticket → In progress</button>
  </main>
  <script src="../dist/parley-live-chat.js" defer></script>
  <script>addEventListener('load', function () { setTimeout(function () { document.getElementById('mode').textContent = window.ParleyChat ? ParleyChat.mode : '?'; }, 100); });</script>
</body>
</html>
